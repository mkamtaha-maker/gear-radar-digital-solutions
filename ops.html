<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>غرفة التشغيل | Gear Radar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Private ops dashboard (Kamal only). The page itself holds no data or keys: it signs in with a Supabase magic link,
   then reads the ops_* tables, which row-level security opens only to accounts listed in ops_admins.
   The n8n workflow "Gear Radar — Ops Monitor" fills them every 3 hours; "Gear Radar — Error Alerts" logs failures live.
   Arabic (MSA) / English: the toggle in the header re-renders from the last loaded data; the choice is kept in localStorage.
   Four tabs (overview, usage, operations, clients) keep each view to about one screen. Charts are plain inline SVG. */
:root{
  --bg:#F2F4F7;--panel:#FFFFFF;--line:#E4E7EC;--fg:#14171C;--muted:#5D6676;--faint:#8B93A1;--accent:#E8763E;--ink:#111418;
  --ok:#16824A;--warn:#B26A00;--bad:#C2402F;--unk:#8A93A0;
  --ok-bg:#E3F4EA;--warn-bg:#FCF0DC;--bad-bg:#FBE5E1;--unk-bg:#EEF0F3;--track:#E9ECF0;
  --s1:#2a78d6;--s2:#eb6834;--s0:#B9C0CA;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014;--panel:#161A20;--line:#252B34;--fg:#E9EBEE;--muted:#9AA3B0;--faint:#6F7885;--accent:#FF8A50;--ink:#090B0E;
  --ok:#4CC98A;--warn:#E3A849;--bad:#EF7A68;--unk:#7D8693;
  --ok-bg:#14301F;--warn-bg:#33270F;--bad-bg:#3A1A15;--unk-bg:#20252C;--track:#232A33;
  --s1:#3987e5;--s2:#d95926;--s0:#4A525E;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1014;--panel:#161A20;--line:#252B34;--fg:#E9EBEE;--muted:#9AA3B0;--faint:#6F7885;--accent:#FF8A50;--ink:#090B0E;
  --ok:#4CC98A;--warn:#E3A849;--bad:#EF7A68;--unk:#7D8693;
  --ok-bg:#14301F;--warn-bg:#33270F;--bad-bg:#3A1A15;--unk-bg:#20252C;--track:#232A33;
  --s1:#3987e5;--s2:#d95926;--s0:#4A525E;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;font-weight:400;overflow-x:hidden}
:root[lang="ar"] body{font-weight:500}
button{font:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.dt{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{direction:ltr}

/* header + tabs */
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#F3F4F6;padding:10px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.brand img{width:32px;height:32px;border-radius:9px;background:#fff;flex:none}
.brand h1{margin:0;font-size:18px;font-weight:700;line-height:1.25}
.brand h1 .hl{color:#FF8A50}
.brand .stamp{display:block;font-size:12px;color:#A3ABB6;font-weight:400}
.tools{display:flex;align-items:center;gap:8px}
.ghost{background:transparent;border:1px solid #363D47;color:#F3F4F6;border-radius:999px;padding:4px 13px;font-size:13px;line-height:1.5}
.ghost:hover{border-color:#6B7380}
.lang{display:inline-flex;border:1px solid #363D47;border-radius:999px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;color:#A3ABB6;border-radius:999px;padding:2px 11px;font-size:13px;line-height:1.5}
.lang button[aria-pressed="true"]{background:#FF8A50;color:#14171C;font-weight:600}
.tabs{max-width:1240px;margin:8px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:#A3ABB6;font-size:14px;padding:8px 14px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#FF8A50;font-weight:600}
.tabs .c{display:inline-block;min-width:19px;margin-inline-start:6px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:17px;text-align:center}

.wrap{max-width:1240px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.muted{color:var(--muted)}
.sub{font-size:13px;color:var(--muted);word-break:break-word;font-weight:400}

/* login */
.login{max-width:420px;margin:48px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.login h2{font-size:20px;margin:0 0 8px}
.login p{margin:0 0 14px;color:var(--muted);font-size:14px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);direction:ltr}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#14171C;font-weight:600;font-size:16px}
.msg{font-size:14px;margin-top:10px;min-height:1.4em}
.msg.err{color:var(--bad)}

/* bento grid */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:980px){.bento{grid-template-columns:repeat(6,minmax(0,1fr))}.c2,.c3{grid-column:span 3}.c4,.c5,.c6,.c7,.c8,.c12{grid-column:span 6}.c2.g{grid-column:span 2}}
@media (max-width:600px){.bento{gap:10px}.c2.g{grid-column:span 3}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.box h3 .meta{margin-inline-start:auto;font-weight:400;font-size:12px;color:var(--muted)}
@media (max-width:600px){.box{padding:13px;border-radius:14px}}

/* KPI tiles */
.kpi{position:relative;overflow:hidden;gap:4px}
.kpi .k{font-size:13px;color:var(--muted);font-weight:500;padding-inline-end:52px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .v.word{font-size:21px}
.kpi.ok .v.word{color:var(--ok)}.kpi.bad .v.word{color:var(--bad)}.kpi.warn .v.word{color:var(--warn)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
:root[dir="rtl"] .kpi::before{border-radius:4px 0 0 4px}
.kpi.ok::before{background:var(--ok)}.kpi.warn::before{background:var(--warn)}.kpi.bad::before{background:var(--bad)}
.kpi .mini{position:absolute;right:14px;top:14px;width:44px;height:44px}
:root[dir="rtl"] .kpi .mini{right:auto;left:14px}
@media (max-width:600px){.kpi .v{font-size:24px}.kpi .v.word{font-size:17px}.kpi .mini{width:34px;height:34px;top:12px;right:10px}:root[dir="rtl"] .kpi .mini{right:auto;left:10px}.kpi .k{padding-inline-end:38px;font-size:12px}}

/* alerts */
.alerts{display:grid;gap:8px;max-height:310px;overflow:auto;padding-inline-end:2px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--bad-bg);border-radius:10px;padding:9px 12px}
.alert.warn{background:var(--warn-bg)}
.alert .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-top:2px}
.alert.warn .ic{background:var(--warn)}
.alert b{display:block;font-size:14px;word-break:break-word}
.alert .side{display:grid;gap:6px;justify-items:end;font-size:12px;color:var(--muted)}
@media (max-width:560px){.alert{grid-template-columns:auto 1fr}.alert .side{grid-column:2;justify-items:start;display:flex;gap:10px;align-items:center}}
.done{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:1px 11px;font-size:12px}
.allgood{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 14px;font-weight:600;display:flex;gap:8px;align-items:center}

/* pills, legends */
.pill{font-size:12px;padding:1px 9px;border-radius:99px;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.unknown{background:var(--unk-bg);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);font-weight:400}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--fg);font-weight:600}

/* donut + gauge */
.donutRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none}
.donut text{fill:var(--fg);font-family:var(--f-body)}
.donut .ct{font-size:22px;font-weight:700}.donut .cs{font-size:9.5px;fill:var(--muted)}
.legend.col{flex-direction:column;gap:6px;flex:1 1 120px}
.gauge{width:100%;max-width:170px;margin:0 auto;display:block}
.gauge text{font-family:var(--f-body);fill:var(--fg)}
.gauge .gv{font-size:19px;font-weight:700}.gauge .gs{font-size:9px;fill:var(--muted)}
.gbox{align-items:stretch;text-align:center;gap:4px}
.gbox h3{justify-content:center;font-size:13px;text-align:center}
.gbox .sub{text-align:center;font-size:12px}

/* bars */
.hbars{display:grid;grid-template-columns:max-content minmax(40px,1fr) max-content;gap:9px 10px;align-items:center;font-size:13px}
.hb{display:contents}
.hb .t{height:10px;background:var(--track);border-radius:99px;overflow:hidden;display:flex}
.hb .t i{display:block;height:100%;border-radius:99px}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hb .val small{color:var(--muted);font-weight:400}
.acc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;font-size:13px}
.acc .t{grid-column:1/-1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.acc .t i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.acc .t i.warn{background:var(--warn)}.acc .t i.bad{background:var(--bad)}
.acc .rs{font-size:11px;color:var(--muted);font-weight:400}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:10px;fill:var(--faint);font-family:var(--f-body)}
.chart .area{fill:var(--s1);opacity:.14}
.chart .line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}
.chart .lab{font-size:10.5px;fill:var(--fg);font-weight:600;font-family:var(--f-body)}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{fill:var(--s1);stroke:var(--panel);stroke-width:2}
.chart .xh,.chart .hov{display:none}.chart.hover .xh,.chart.hover .hov{display:inline}
@media (max-width:600px){.chart .ax{font-size:15px}.chart .lab{font-size:15px}.tabs button{padding:8px 10px 10px;font-size:13px}}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#F3F4F6;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .1s}
#tip.on{opacity:1}

/* heartbeats + tables */
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.beat{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.beat .ic{grid-row:span 2;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--ok-bg);color:var(--ok)}
.beat.bad .ic{background:var(--bad-bg);color:var(--bad)}.beat.warn .ic{background:var(--warn-bg);color:var(--warn)}
.beat b{font-size:13px;font-weight:600;line-height:1.35}
.beat .ea{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.beat .ea small{color:var(--muted);font-weight:400}
.beat .sub{grid-column:2/-1;font-size:12px}
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .stack thead{display:none}
  .stack tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .stack tr:last-child{border-bottom:0}
  .stack td{border:0;padding:0;text-align:start}
  .stack td.who{grid-row:1;grid-column:1/3}
  .stack td.st{grid-row:1;grid-column:3;justify-self:end}
  .stack td.n::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:400}
}
.foot{font-size:12px;color:var(--muted);margin-top:18px;font-weight:400}
.big{font-size:26px;font-weight:700;line-height:1.15}
.big small{font-size:13px;color:var(--muted);font-weight:500}
@media (max-width:560px){.brand h1{font-size:16px}.ghost{padding:3px 10px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">
      <img src="images/gear-radar-logo.png" alt="">
      <h1><span data-t="titleA">غرفة</span> <span class="hl" data-t="titleB">التشغيل</span><small class="stamp" id="stamp"></small></h1>
    </div>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button type="button" data-lang="ar" aria-pressed="true">ع</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="ghost" id="refresh" type="button" hidden data-t="refresh">تحديث</button>
      <button class="ghost" id="logout" type="button" hidden data-t="logout">خروج</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</header>

<main class="wrap" id="app">
  <section class="login" id="login" hidden>
    <h2 data-t="loginTitle">تسجيل الدخول</h2>
    <p data-t="loginText">أدخل بريدك الإلكتروني وسيصلك رابط للدخول. هذه الصفحة مخصّصة لأصحاب الحساب فقط.</p>
    <form id="loginForm">
      <label for="email" class="muted" style="font-size:13px" data-t="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button class="btn" type="submit" id="sendLink" data-t="sendLink">أرسل رابط الدخول</button>
      <div class="msg" id="loginMsg" role="status"></div>
    </form>
  </section>
  <section id="denied" hidden class="login">
    <h2 data-t="deniedTitle">هذا البريد لا يملك صلاحية</h2>
    <p data-t="deniedText">أنت مسجّل الدخول الآن بهذا البريد، وهو ليس من الحسابات المسموح لها برؤية البيانات:</p>
    <p class="num" id="deniedEmail"></p>
    <button class="btn" type="button" id="switchAccount" data-t="switchAccount">سجّل الخروج وادخل ببريد آخر</button>
  </section>
  <div id="board" hidden></div>
</main>
<div id="tip" role="tooltip"></div>

    // failed runs come from two places: the hb.failures24 check (written every 3 hours) and the open events (live).
    // Once every failure of the last 24 hours is marked done here, the check stops counting as a problem,
    // and each open failure counts once in the headline, the status mix and the tab badge alike.
    var day1 = Date.now() - 864e5;
    var open24 = events.filter(function(e){ return new Date(e.occurred_at).getTime() >= day1; }).length;
    checks = checks.map(function(c){
      if (c.key !== 'hb.failures24' || c.status !== 'bad' || open24) return c;
      return Object.assign({}, c, { status: 'ok', note: (c.note ? c.note + ' · ' : '') + t('allResolved') });
    });
    all = metrics.concat(checks);
    var red = checks.filter(function(c){ return c.status === 'bad' && c.key !== 'hb.failures24'; })
      .concat(metrics.filter(function(m){ return m.status === 'bad'; }));
    var amber = all.filter(function(x){ return x.status === 'warn'; });
    var n8 = get('n8n.month'), js = get('jsearch.total'), tala = get('biz.tala'), jr = get('biz.jobradar'), sign = get('biz.signups');
    var jsAcc = metrics.filter(function(m){ return /^jsearch\.\d+$/.test(m.key); });
    var engRows = eng.error ? [] : (eng.data || []);
    var V = {};

    // ===== overview =====
    var health = red.length || events.length ? 'bad' : amber.length ? 'warn' : 'ok';
    var hv = red.length + events.length ? t('kIssues', { n: red.length + events.length }) : amber.length ? t('kWarn', { n: amber.length }) : t('kAllOk');
    // status mix: every open failure is one "needs action" item, replacing the summary check while any is open
    var mixAll = events.length ? all.filter(function(x){ return x.key !== 'hb.failures24'; }).concat(events.map(function(){ return { status: 'bad' }; })) : all;
    var cnt = function(s){ return mixAll.filter(function(x){ return x.status === s; }).length; };
    var mix = ['ok', 'warn', 'bad', 'unknown'].map(function(s){ return { v: cnt(s), c: COL[s], l: STATUS[lang][s] }; }).filter(function(s){ return s.v; });
    var jsLeft = jsAcc.reduce(function(a, m){ return a + Math.max(0, Number(m.lim || 0) - Number(m.used || 0)); }, 0), jsLim = jsAcc.reduce(function(a, m){ return a + Number(m.lim || 0); }, 0);
    var kpis = '<div class="box kpi c3 ' + health + '"><div class="k">' + esc(t('kHealth')) + '</div><div class="v word">' + esc(hv) + '</div><div class="sub">' + (events.length ? esc(t('kOpen', { n: events.length })) : '&nbsp;') + '</div>' + donut(mix, null, null, 'mini') + '</div>'
      + (n8 ? '<div class="box kpi c3 ' + esc(n8.status) + '"><div class="k">' + esc(t('kN8n')) + '</div><div class="v"><span class="num">' + fmt(n8.used) + '</span>' + (n8.lim ? ' <small class="num">/ ' + fmt(n8.lim) + '</small>' : '') + '</div><div class="sub">' + (resetTxt(n8.reset_at) || '&nbsp;') + '</div>'
        + (n8.lim ? donut([{ v: Number(n8.used), c: COL[n8.status], l: t('used') }, { v: Math.max(0, n8.lim - n8.used), c: 'var(--track)', l: t('left') }], null, null, 'mini') : '') + '</div>' : '')
      + (js ? '<div class="box kpi c3 ' + esc(js.status) + '"><div class="k">' + esc(t('kJs')) + '</div><div class="v"><span class="num">' + fmt(js.used) + '</span></div><div class="sub">' + esc(t('kJsAcc', { a: jsAcc.filter(function(m){ return m.status !== 'bad'; }).length, b: jsAcc.length })) + '</div>'
        + (jsLim ? donut([{ v: jsLeft, c: COL[js.status], l: t('left') }, { v: jsLim - jsLeft, c: 'var(--track)', l: t('used') }], null, null, 'mini') : '') + '</div>' : '')
      + (tala ? '<div class="box kpi c3 ' + esc(tala.status) + '"><div class="k">' + esc(t('kTala')) + '</div><div class="v"><span class="num">' + fmt(tala.used) + '</span></div><div class="sub">' + (esc(note(tala.note)) || '&nbsp;') + '</div></div>' : '');
    var items = red.map(function(x){ return '<div class="alert"><span class="ic">!</span><div><b>' + esc(label(x)) + '</b><div class="sub">' + esc(note(x.note)) + '</div></div><div class="side"></div></div>'; })
      .concat(events.map(function(e){
        return '<div class="alert warn"><span class="ic">!</span><div><b>' + esc(t('failed', { w: e.workflow_name || t('workflow') })) + '</b><div class="sub">'
          + (e.node ? esc(t('step')) + ': <bdi>' + esc(e.node) + '</bdi> · ' : '') + '<span dir="auto">' + esc(e.message) + '</span>'
          + (e.url ? ' · <a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(t('openRun')) + '</a>' : '') + '</div></div>'
          + '<div class="side"><span class="dt">' + esc(when(e.occurred_at)) + '</span><button class="done" type="button" data-ev="' + e.id + '">' + esc(t('resolve')) + '</button></div></div>';
      }));
    var accRows = jsAcc.map(function(m){
      var lim = Number(m.lim || 0), left = Math.max(0, lim - Number(m.used || 0)), pct = lim ? left / lim * 100 : 0;
      return '<div class="acc"><span>' + esc(t('account', { n: m.key.split('.')[1] })) + ' <span class="rs">' + resetTxt(m.reset_at) + '</span></span><span class="num" style="font-weight:600">' + fmt(left) + ' <small class="muted" style="font-weight:400">/ ' + fmt(lim) + '</small></span>'
        + '<span class="t"><i class="' + esc(m.status) + '" style="width:' + pct.toFixed(1) + '%" data-tip="' + esc(t('leftOf', { a: fmt(left), b: fmt(lim) })) + '"></i></span></div>';
    }).join('');
    var n8pts = (byHist['n8n.month'] || []).map(function(h){ return { x: new Date(h.taken_at), y: Number(h.used) }; });
    if (n8 && n8.reset_at) { var cycleStart = new Date(n8.reset_at); cycleStart.setUTCMonth(cycleStart.getUTCMonth() - 1); n8pts = n8pts.filter(function(p){ return p.x >= cycleStart; }); }
    V.overview = '<div class="bento">' + kpis
      + box('c7', esc(t('attention')), items.length ? '<div class="alerts">' + items.join('') + '</div>' : '<div class="allgood">✓ ' + esc(t('allGood')) + '</div>')
      + box('c5', esc(t('statusMix')), '<div class="donutRow">' + donut(mix, cnt('ok') + '/' + mixAll.length, t('healthy')) + legend(mix, true) + '</div>')
      + box('c7', esc(t('n8nTrend')), areaChart(n8pts) + (n8 ? '<div class="sub">' + esc(note(n8.note)) + (n8.lim ? ' · ' + esc(t('limitOf', { l: fmt(n8.lim) })) : '') + '</div>' : ''))
      + box('c5', esc(t('jsTitle')), '<div class="donutRow">' + donut([{ v: jsLeft, c: 'var(--s1)', l: t('left') }, { v: jsLim - jsLeft, c: 'var(--s0)', l: t('used') }], fmt(jsLeft), t('left')) + '<div style="flex:1 1 170px;display:grid;gap:8px">' + accRows + '</div></div>'
        + (js ? '<div class="sub">' + esc(note(js.note)) + '</div>' : ''), 'OpenWeb Ninja')
      + '</div>';

    // ===== usage =====
    var gauges = ['n8n.month', 'apify.month', 'kam.emails', 'supabase.db', 'supabase.storage', 'wa.templates'].map(get).filter(function(m){ return m && m.lim; }).map(function(m){
      var sub = [esc(note(m.note)), resetTxt(m.reset_at)].filter(Boolean).join(' · ');
      return '<div class="box gbox c2 g"><h3>' + esc(SHORT[lang][m.key] || label(m)) + '</h3>' + gauge(m) + '<div>' + pill(m.status) + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
    }).join('');
    // n8n executions per London day: the highest "today" reading taken that day
    var daily = {}; (byHist['n8n.today'] || []).forEach(function(h){ var k = new Date(h.taken_at).toLocaleDateString('en-CA', { timeZone: 'Europe/London' }); daily[k] = Math.max(daily[k] || 0, Number(h.used)); });
    var dGroups = Object.keys(daily).sort().slice(-7).map(function(k){ return { label: day(k + 'T12:00:00Z'), vals: [daily[k]] }; });
    var money = ['stripe.balance', 'paypal.balance', 'wa.quality'].map(get).filter(Boolean).map(function(m){
      var big = m.key === 'wa.quality' ? '<span class="num">' + esc(m.unit || '—') + '</span>' : '<span class="num">' + fmt(m.used) + '</span> <small>' + esc(m.unit || '') + '</small>';
      return '<div class="box c4"><h3>' + esc(label(m)) + '<span class="meta">' + pill(m.status) + '</span></h3><div class="big">' + big + '</div><div class="sub">' + esc(note(m.note)) + '</div></div>';
    }).join('');
    var jsBars = hbars(jsAcc.map(function(m){
      var lim = Number(m.lim || 0), left = Math.max(0, lim - Number(m.used || 0));
      return { l: esc(t('account', { n: m.key.split('.')[1] })), v: left, c: COL[m.status], txt: '<span class="num">' + fmt(left) + '</span> <small>/ ' + fmt(lim) + '</small>', tip: t('leftOf', { a: fmt(left), b: fmt(lim) }) + (m.reset_at ? ' · ' + t('resets') + ' ' + day(m.reset_at) : '') };
    }), Math.max.apply(null, jsAcc.map(function(m){ return Number(m.lim || 0); }).concat([1])));
    V.usage = '<div class="bento">' + gauges
      + box('c6', esc(t('n8nDaily')), columns(dGroups, ['var(--s1)']))
      + box('c6', esc(t('jsTitle')), jsBars + (js ? '<div class="sub">' + esc(note(js.note)) + '</div>' : ''), '<span class="num">' + fmt(jsLeft) + '</span> ' + esc(t('left')))
      + money + '</div>';

    // ===== operations =====
    var hb = checks.filter(function(c){ return c.kind === 'heartbeat'; }), hl = checks.filter(function(c){ return c.kind === 'health'; });
    var beats = '<div class="beats">' + hb.map(function(c){
      return '<div class="beat ' + esc(c.status) + '"><span class="ic" aria-label="' + esc(STATUS[lang][c.status] || c.status) + '">' + (ICON[c.status] || '?') + '</span><b>' + esc(label(c)) + '</b><span class="ea" title="' + esc(t('expectedActual')) + '"><span class="num">' + fmt(c.actual) + '</span><small> / ' + fmt(c.expected) + '</small></span><div class="sub">' + esc(note(c.note)) + '</div></div>';
    }).join('') + '</div>';
    var lat = hl.map(function(c){ var ms = /^(\d+) ms$/.exec(c.note || ''); return { c: c, ms: ms ? Number(ms[1]) : null }; });
    var latBars = hbars(lat.map(function(x){
      return { l: '<bdi>' + esc(label(x.c)) + '</bdi>', v: x.ms || 0, c: COL[x.c.status], txt: x.ms != null ? '<span class="num">' + fmt(x.ms) + '</span> <small>ms</small>' : pill(x.c.status, note(x.c.note)), tip: note(x.c.note) };
    }), Math.max.apply(null, lat.map(function(x){ return x.ms || 0; }).concat([1])));
    V.ops = '<div class="bento">' + box('c7', esc(t('beats')), beats, esc(t('expectedActual'))) + box('c5', esc(t('latency')), latBars) + '</div>';

    // ===== clients (counts only, never message content) =====
    var ch = function(c){ return c === 'whatsapp' ? t('whatsapp') : c === 'telegram' ? t('telegram') : c; };
    var chCount = {}; engRows.forEach(function(r){ chCount[r.channel] = (chCount[r.channel] || 0) + 1; });
    var chSegs = Object.keys(chCount).sort().reverse().map(function(k, i){ return { v: chCount[k], c: i ? 'var(--s2)' : 'var(--s1)', l: ch(k) }; });
    var stCount = {}; engRows.forEach(function(r){ stCount[r.engagement] = (stCount[r.engagement] || 0) + 1; });
    var stSegs = Object.keys(ENG).filter(function(k){ return stCount[k]; }).map(function(k){ return { v: stCount[k], c: COL[ENG[k][0]], l: lang === 'ar' ? ENG[k][1] : ENG[k][2] }; });
    var kindTot = {}; engRows.forEach(function(r){ Object.keys(r.kinds_30d || {}).forEach(function(k){ kindTot[k] = (kindTot[k] || 0) + Number(r.kinds_30d[k]); }); });
    var kindKeys = Object.keys(kindTot).sort(function(a, b){ return kindTot[b] - kindTot[a]; }).slice(0, 6);
    var kindRows = kindKeys.map(function(k){ return { l: '<bdi>' + esc(KIND[lang][k] || k.replace(/^cmd:/, '')) + '</bdi>', v: kindTot[k] }; });
    var engGroups = engRows.filter(function(r){ return r.msgs_30d > 0 || r.msgs_7d > 0; }).slice(0, 8).map(function(r){ return { label: r.full_name, vals: [Number(r.msgs_7d || 0), Number(r.msgs_prev_7d || 0)] }; });
    var sum = function(k){ return engRows.reduce(function(a, r){ return a + Number(r[k] || 0); }, 0); };
    var numTd = function(k, v){ return '<td class="n" data-l="' + esc(t(k)) + '"><span class="num">' + v + '</span></td>'; };
    var table = eng.error ? '<div class="sub">' + esc(t('engErr')) + esc(eng.error.message) + '</div>'
      : !engRows.length ? '<div class="sub">' + esc(t('engNone')) + '</div>'
      : '<div class="tbl"><table class="stack"><thead><tr><th>' + esc(t('client')) + '</th><th class="n">' + esc(t('d7')) + '</th><th class="n">' + esc(t('prev7')) + '</th><th class="n">' + esc(t('d30')) + '</th><th class="n">' + esc(t('activeDays')) + '</th><th class="n">' + esc(t('lastActive')) + '</th><th>' + esc(t('status')) + '</th></tr></thead><tbody>'
        + engRows.map(function(r){
            var e = ENG[r.engagement] || ['unknown', r.engagement, r.engagement];
            return '<tr><td class="who"><span dir="auto">' + esc(r.full_name) + '</span><div class="sub">' + esc(ch(r.channel)) + '</div></td>'
              + numTd('d7', fmt(r.msgs_7d)) + numTd('prev7', fmt(r.msgs_prev_7d)) + numTd('d30', fmt(r.msgs_30d)) + numTd('activeDays', fmt(r.active_days_30d))
              + '<td class="n" data-l="' + esc(t('lastActive')) + '"><span class="dt">' + esc(r.last_active ? day(r.last_active) : '—') + '</span></td>'
              + '<td class="st">' + pill(e[0], lang === 'ar' ? e[1] : e[2]) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
    var bizTile = function(m, k){ return m ? '<div class="box kpi c4 ' + esc(m.status) + '"><div class="k">' + esc(t(k)) + '</div><div class="v"><span class="num">' + fmt(m.used) + '</span></div><div class="sub">' + (esc(note(m.note)) || '&nbsp;') + '</div></div>' : ''; };
    V.clients = '<div class="bento">' + bizTile(tala, 'kTala') + bizTile(jr, 'kJr') + bizTile(sign, 'kSignups')
      + box('c6', esc(t('engBars')), columns(engGroups, ['var(--s1)', 'var(--s0)'], [t('thisWeek'), t('lastWeek')]) + legend([{ c: 'var(--s1)', l: t('thisWeek'), v: sum('msgs_7d') }, { c: 'var(--s0)', l: t('lastWeek'), v: sum('msgs_prev_7d') }]))
      + box('c3', esc(t('engMix')), '<div class="donutRow" style="justify-content:center">' + donut(stSegs, String(engRows.length), t('clientsN')) + legend(stSegs) + '</div>')
      + box('c3', esc(t('channels')), '<div class="donutRow" style="justify-content:center">' + donut(chSegs, String(engRows.length), t('clientsN')) + legend(chSegs) + '</div>')
      + box('c4', esc(t('kinds')), kindRows.length ? hbars(kindRows, kindTot[kindKeys[0]], 'var(--s1)') : '<div class="sub">' + esc(t('noChart')) + '</div>')
      + box('c8', esc(t('engagement')), table + '<div class="sub">' + esc(t('engNote')) + '</div>')
      + '</div>';

    $('board').innerHTML = V[tab] + '<p class="foot">' + esc(t('foot')) + '</p>';
    var opsBad = hb.concat(hl).filter(function(c){ return c.status === 'bad'; }).length;
    $('tabs').innerHTML = [['overview', 'tabOverview', red.length + events.length], ['usage', 'tabUsage'], ['ops', 'tabOps', opsBad], ['clients', 'tabClients']].map(function(x){
      return '<button type="button" role="tab" data-tab="' + x[0] + '" aria-selected="' + (x[0] === tab) + '">' + esc(t(x[1])) + (x[2] ? '<span class="c">' + x[2] + '</span>' : '') + '</button>';
    }).join('');
    $('tabs').hidden = false;
  }

  // ---------- tooltips + crosshair ----------
  var tip = $('tip');
  function showTip(x, y, html){ tip.innerHTML = html; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on'); }
  document.addEventListener('pointermove', function(ev){
    var tg = ev.target.closest ? ev.target : ev.target.parentElement;
    var svg = tg && tg.closest('svg[data-series]');
    if (svg) {
      var s = JSON.parse(svg.getAttribute('data-series')), r = svg.getBoundingClientRect(), W = Number(svg.getAttribute('data-w')), H = Number(svg.getAttribute('data-h'));
      var x = (ev.clientX - r.left) / r.width * W, best = s.reduce(function(a, p){ return Math.abs(p[0] - x) < Math.abs(a[0] - x) ? p : a; }, s[0]);
      svg.classList.add('hover');
      var xh = svg.querySelector('.xh'), dot = svg.querySelector('.hov');
      xh.setAttribute('x1', best[0]); xh.setAttribute('x2', best[0]); dot.setAttribute('cx', best[0]); dot.setAttribute('cy', best[1]);
      showTip(r.left + best[0] / W * r.width, r.top + best[1] / H * r.height - 8, esc(best[2]) + ' · <b>' + esc(best[3]) + '</b>');
      return;
    }
    var el = tg && tg.closest('[data-tip]');
    if (el) { showTip(ev.clientX, ev.clientY - 8, esc(el.getAttribute('data-tip'))); return; }
    tip.classList.remove('on');
    document.querySelectorAll('svg.hover').forEach(function(c){ c.classList.remove('hover'); });
  });

  document.addEventListener('click', async function(ev){
    var lb = ev.target.closest('[data-lang]');
    if (lb) {
      lang = lb.getAttribute('data-lang');
      try { localStorage.setItem('ops-lang', lang); } catch (e) {}
      applyLang(); render();
      return;
    }
    var tb = ev.target.closest('[data-tab]');
    if (tb) {
      tab = tb.getAttribute('data-tab');
      try { history.replaceState(null, '', '#' + tab); } catch (e) {}
      render(); window.scrollTo(0, 0);
      return;
    }
    var b = ev.target.closest('[data-ev]');
    if (!b) return;
    b.disabled = true;
    var r = await sb.from('ops_events').update({ resolved_at: new Date().toISOString() }).eq('id', Number(b.getAttribute('data-ev')));
    if (r.error) { b.disabled = false; b.textContent = t('notSaved'); return; }
    if (last) last.events = last.events.filter(function(e){ return String(e.id) !== b.getAttribute('data-ev'); });
    render();
  });

  async function show(session){
    var signedIn = !!session;
    $('login').hidden = signedIn; $('logout').hidden = !signedIn; $('refresh').hidden = true;
    $('denied').hidden = true; $('board').hidden = true; $('tabs').hidden = true;
    if (!signedIn) { $('stamp').textContent = ''; return; }
    var a = await sb.from('ops_admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (!a.data) { $('denied').hidden = false; $('deniedEmail').textContent = session.user.email || ''; $('stamp').textContent = ''; return; }
    $('board').hidden = false; $('refresh').hidden = false;
    load();
  }

  $('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = $('loginMsg'); msg.className = 'msg'; msg.textContent = t('sending');
    $('sendLink').disabled = true;
    var r = await sb.auth.signInWithOtp({ email: $('email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
    $('sendLink').disabled = false;
    if (r.error) {
      msg.className = 'msg err';
      // Supabase's built-in mailer only sends a few login emails an hour
      msg.textContent = (r.error.status === 429 || /rate limit/i.test(r.error.message)) ? t('rateLimit') : t('sendErr') + r.error.message;
      return;
    }
    msg.textContent = t('sent');
  });
  $('logout').addEventListener('click', async function(){ await sb.auth.signOut(); show(null); });
  $('switchAccount').addEventListener('click', async function(){ await sb.auth.signOut(); show(null); });
  $('refresh').addEventListener('click', load);
  applyLang();
  sb.auth.onAuthStateChange(function(_e, session){ show(session); });
  setInterval(function(){ if (!$('board').hidden && document.visibilityState === 'visible') load(); }, 10 * 60 * 1000);
})();
</script>
</body>
