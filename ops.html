<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>غرفة التشغيل | Gear Radar</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15171C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Private ops dashboard (Kamal only). The page itself holds no data or keys: it signs in with a Supabase magic link,
   then reads the ops_* tables, which row-level security opens only to accounts listed in ops_admins.
   The n8n workflow "Gear Radar — Ops Monitor" fills them every 3 hours; "Gear Radar — Error Alerts" logs failures live. */
:root{
  --bg:#F3F4F6;--panel:#FFFFFF;--line:#E2E5EA;--fg:#15171C;--muted:#5B6475;--accent:#E8763E;--ink:#15171C;
  --ok:#16824A;--warn:#B26A00;--bad:#C2402F;--unk:#6B7280;
  --ok-bg:#E3F4EA;--warn-bg:#FCF0DC;--bad-bg:#FBE5E1;--unk-bg:#EEF0F3;--track:#E6E9EE;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--panel:#171B21;--line:#262C35;--fg:#E8EAED;--muted:#98A2AF;--accent:#FF8A50;--ink:#0B0D10;
  --ok:#4CC98A;--warn:#E3A849;--bad:#EF7A68;--unk:#9AA3AE;
  --ok-bg:#14301F;--warn-bg:#33270F;--bad-bg:#3A1A15;--unk-bg:#20252C;--track:#232A33;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216;--panel:#171B21;--line:#262C35;--fg:#E8EAED;--muted:#98A2AF;--accent:#FF8A50;--ink:#0B0D10;
  --ok:#4CC98A;--warn:#E3A849;--bad:#EF7A68;--unk:#9AA3AE;
  --ok-bg:#14301F;--warn-bg:#33270F;--bad-bg:#3A1A15;--unk-bg:#20252C;--track:#232A33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#F3F4F6;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1 1 auto}
.top h1 span{color:#FF8A50}
.top .stamp{font-size:13px;color:#A8B0BB}
.top button{background:transparent;border:1px solid #3A414B;color:#F3F4F6;border-radius:999px;padding:5px 14px;font-size:13px}
.top button:focus-visible,.btn:focus-visible,.done:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#board:not([hidden]){display:grid;gap:26px}
.wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:26px}
h2{margin:0 0 10px;font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.login{max-width:420px;margin:48px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.login h2{font-size:20px}
.login p{margin:0 0 14px;color:var(--muted);font-size:14px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);direction:ltr}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#15171C;font-weight:600;font-size:16px}
.msg{font-size:14px;margin-top:10px;min-height:1.4em}
.msg.err{color:var(--bad)}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--bad-bg);border-inline-start:4px solid var(--bad);padding:10px 14px;border-radius:8px}
.alert.warn{background:var(--warn-bg);border-color:var(--warn)}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:8px;background:var(--bad)}
.alert.warn .dot{background:var(--warn)}
.alert b{display:block}
.alert .sub{font-size:13px;color:var(--muted);word-break:break-word}
.alert .side{display:grid;gap:6px;justify-items:end;font-size:12px;color:var(--muted)}
.alert a{color:inherit}
.done{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:2px 12px;font-size:12px}
.allgood{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;font-size:14px;font-weight:600}
.big{font-size:22px;font-weight:600}
.big small{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.unknown{background:var(--unk)}
.sub{font-size:13px;color:var(--muted);word-break:break-word}
.pill{font-size:12px;padding:1px 10px;border-radius:99px;white-space:nowrap;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.unknown{background:var(--unk-bg);color:var(--unk)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:12px}
@media (max-width:780px){.two{grid-template-columns:1fr}}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
.spark{width:100%;height:34px;display:block}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark path.a{fill:var(--accent);opacity:.12}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>غرفة <span>التشغيل</span></h1>
  <span class="stamp" id="stamp"></span>
  <button id="refresh" type="button" hidden>تحديث</button>
  <button id="logout" type="button" hidden>خروج</button>
</div></header>

<main class="wrap" id="app">
  <section class="login" id="login" hidden>
    <h2>دخول</h2>
    <p>اكتب إيميلك، وحيجيك رابط دخول. الصفحة دي لأصحاب الحساب بس.</p>
    <form id="loginForm">
      <label for="email" class="muted" style="font-size:13px">الإيميل</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button class="btn" type="submit" id="sendLink">أرسل رابط الدخول</button>
      <div class="msg" id="loginMsg" role="status"></div>
    </form>
  </section>
  <section id="denied" hidden class="login">
    <h2>الإيميل ده ما عنده صلاحية</h2>
    <p>إنت داخل هسي بالإيميل ده، وهو ما من الحسابات المسموح ليها تشوف البيانات:</p>
    <p class="num" id="deniedEmail"></p>
    <button class="btn" type="button" id="switchAccount">اخرج وادخل بإيميل تاني</button>
  </section>
  <div id="board" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SB_URL = 'https://nrkydwotserhniczcgqs.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ya3lkd290c2VyaG5pY3pjZ3FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzU0MzMsImV4cCI6MjEwNTgxMTQzM30.6v1fSTrg00Wj7JM0B18aBfwYzNPngv5y4uaf-HmsYq0'; // public anon key: ops_* tables return nothing without an approved login
  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'implicit' } });
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmt = function(n){ return n == null ? '—' : Number(n).toLocaleString('en-GB', { maximumFractionDigits: 2 }); };
  var when = function(iso){ if (!iso) return ''; var d = new Date(iso); return d.toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' }); };
  var day = function(iso){ return iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', timeZone:'Europe/London' }) : ''; };
  var STATUS = { ok:'سليم', warn:'انتبه', bad:'محتاج تدخل', unknown:'غير معروف' };
  var pill = function(s){ return '<span class="pill ' + esc(s) + '">' + (STATUS[s] || esc(s)) + '</span>'; };

  var LABELS = {
    'n8n.month':'عمليات n8n هذا الشهر','n8n.today':'عمليات n8n اليوم',
    'jsearch.total':'JSearch: المتبقي في كل الحسابات','jsearch.1':'JSearch حساب 1','jsearch.2':'JSearch حساب 2','jsearch.3':'JSearch حساب 3',
    'wa.quality':'جودة رقم واتساب','wa.templates':'قوالب واتساب المعتمدة',
    'stripe.balance':'رصيد Stripe','paypal.balance':'رصيد PayPal',
    'apify.month':'رصيد Apify (ليدز كام)','kam.emails':'إيميلات كام اليوم',
    'supabase.db':'قاعدة بيانات Supabase','supabase.storage':'ملفات Supabase',
    'biz.tala':'عملاء تالا النشطين','biz.jobradar':'عملاء JobRadar النشطين','biz.signups':'تسجيلات هذا الشهر',
    'hb.failures24':'تشغيلات فشلت آخر 24 ساعة','hb.tala':'جدولة تالا (البريف والتذكيرات)','hb.collector':'جمع الوظائف','hb.matcher':'تقييم الوظائف',
    'hb.alerts':'تنبيهات JobRadar','hb.affiliate':'مدفوعات الشركاء (10:00)','hb.referral':'مكافآت الإحالة (10:00)',
    'health.openmeteo':'Open-Meteo (الطقس)','health.erapi':'open.er-api (العملات)','health.nominatim':'Nominatim (العناوين)',
    'health.gemini':'Gemini API','health.site':'gearradar.co.uk'
  };
  var GROUPS = [['n8n','n8n'],['jsearch','OpenWeb Ninja · JSearch'],['whatsapp','واتساب'],['money','الفلوس'],['supabase','Supabase'],['other','خدمات تانية'],['business','العملاء']];

  // Notes come from the monitor in English; show the common ones in Arabic.
  function note(s){
    if (!s) return '';
    var t = String(s), m;
    if (/NOT_AUTHORIZED|insufficient permissions|balance permission/i.test(t)) return 'تطبيق PayPal محتاج صلاحية قراءة الرصيد';
    if (t === 'n8n API key not connected') return 'مفتاح n8n API لسه ما اتربط';
    if (t === 'used up') return 'خلص';
    if (t === 'key works') return 'المفتاح شغال';
    if (t === 'check failed') return 'الفحص فشل';
    if (t === 'no data') return 'ما في بيانات';
    if (t === 'no runs yet') return 'ما اشتغل لسه';
    if (t === 'none') return 'ولا واحد';
    if (t === 'daily warm-up limit') return 'حد التسخين اليومي';
    if (t === 'none rejected or paused') return 'ما في قالب مرفوض أو موقوف';
    if (t === 'refunds possible') return 'الاسترداد ممكن';
    if ((m = t.match(/^(\d+) left$/))) return 'متبقي ' + m[1];
    if ((m = t.match(/^about (\d+) days at (\d+)\/day$/))) return 'يكفي حوالي ' + m[1] + ' يوم (' + m[2] + ' طلب في اليوم)';
    if ((m = t.match(/^projected (\d+) by month end( · plan limit not set)?$/))) return 'المتوقع لآخر الشهر ' + m[1] + (m[2] ? ' · حد الباقة ما اتحدد' : '');
    if ((m = t.match(/^last (\d\d:\d\d)$/))) return 'آخر مرة ' + m[1];
    if ((m = t.match(/^(\d+) failed today, last at (\d\d:\d\d)$/))) return m[1] + ' فشل اليوم، آخرها ' + m[2];
    if ((m = t.match(/^(\d+) failed today$/))) return m[1] + ' فشل اليوم';
    if ((m = t.match(/^(\d+) failed$/))) return m[1] + ' فشل';
    if ((m = t.match(/^(\d+) ms$/))) return m[1] + ' ms';
    return t.replace('pending £', 'معلّق £').replace('WhatsApp', 'واتساب').replace('Telegram', 'تيليجرام').replace(' paid', ' مدفوع');
  }

  function spark(rows){
    var v = rows.map(function(r){ return Number(r.used); }).filter(function(x){ return !isNaN(x); });
    if (v.length < 2) return '';
    var W = 240, H = 34, min = Math.min.apply(null, v), max = Math.max.apply(null, v), span = (max - min) || 1;
    var pts = v.map(function(y, i){ return [ (i / (v.length - 1)) * W, H - 3 - ((y - min) / span) * (H - 6) ]; });
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="' + d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z"/><path class="l" d="' + d + '"/></svg>';
  }

  function card(m, hist){
    var lim = m.lim != null ? Number(m.lim) : null, used = m.used != null ? Number(m.used) : null;
    var pct = (lim && used != null) ? Math.min(100, Math.max(2, used / lim * 100)) : null;
    var big = m.key === 'wa.quality' ? '<span class="num">' + esc(m.unit || '—') + '</span>'
      : '<span class="num">' + fmt(used) + '</span>' + (lim != null ? ' <small class="num">/ ' + fmt(lim) + '</small>' : '') + (m.unit === 'GBP' || m.unit === 'USD' ? ' <small>' + esc(m.unit) + '</small>' : '');
    return '<div class="card"><div class="head"><h3>' + esc(LABELS[m.key] || m.label) + '</h3>' + pill(m.status) + '</div>'
      + '<div class="big">' + big + '</div>'
      + (pct != null ? '<div class="bar"><i class="' + esc(m.status) + '" style="width:' + pct.toFixed(1) + '%"></i></div>' : '')
      + (hist && hist.length > 1 ? spark(hist) : '')
      + '<div class="sub">' + esc(note(m.note)) + (m.reset_at ? (m.note ? ' · ' : '') + 'يتجدد <span class="num">' + esc(day(m.reset_at)) + '</span>' : '') + '</div></div>';
  }

  async function load(){
    $('stamp').textContent = 'بيحمّل…';
    var since = new Date(Date.now() - 7 * 864e5).toISOString();
    var res = await Promise.all([
      sb.from('ops_metrics').select('*').order('sort'),
      sb.from('ops_checks').select('*').order('sort'),
      sb.from('ops_events').select('*').is('resolved_at', null).gte('occurred_at', since).order('occurred_at', { ascending: false }).limit(40),
      sb.from('ops_metric_history').select('key,used,taken_at').in('key', ['n8n.month', 'jsearch.total', 'n8n.today']).gte('taken_at', new Date(Date.now() - 30 * 864e5).toISOString()).order('taken_at')
    ]);
    var err = res.find(function(r){ return r.error; });
    if (err) { $('stamp').textContent = 'حصل خطأ: ' + err.error.message; return; }
    var metrics = res[0].data, checks = res[1].data, events = res[2].data, hist = res[3].data;
    var eng = await sb.rpc('ops_client_engagement');
    var byHist = {}; hist.forEach(function(h){ (byHist[h.key] = byHist[h.key] || []).push(h); });
    var latest = metrics.concat(checks).map(function(x){ return x.updated_at || x.checked_at; }).sort().pop();
    $('stamp').innerHTML = latest ? 'آخر تحديث <span class="num">' + esc(when(latest)) + '</span> · كل 3 ساعات' : 'لسه ما في بيانات';

    var html = '';
    // 1. what needs attention
    var red = checks.filter(function(c){ return c.status === 'bad' && c.key !== 'hb.failures24'; })
      .concat(metrics.filter(function(m){ return m.status === 'bad'; }));
    var items = red.map(function(x){ return '<div class="alert"><i class="dot"></i><div><b>' + esc(LABELS[x.key] || x.label) + '</b><div class="sub">' + esc(note(x.note)) + '</div></div><div class="side"></div></div>'; })
      .concat(events.map(function(e){
        return '<div class="alert warn"><i class="dot"></i><div><b>' + esc(e.workflow_name || 'فلو') + ' وقع</b><div class="sub">'
          + (e.node ? 'الخطوة: <span class="num">' + esc(e.node) + '</span> · ' : '') + '<span dir="auto">' + esc(e.message) + '</span>'
          + (e.url ? ' · <a href="' + esc(e.url) + '" target="_blank" rel="noopener">افتح التشغيل</a>' : '') + '</div></div>'
          + '<div class="side"><span class="num">' + esc(when(e.occurred_at)) + '</span><button class="done" type="button" data-ev="' + e.id + '">اتحلّت</button></div></div>';
      }));
    html += '<section><h2>محتاج انتباهك</h2>' + (items.length ? '<div class="alerts">' + items.join('') + '</div>' : '<div class="allgood">كل حاجة شغالة تمام</div>') + '</section>';

    // 2. quotas by group
    GROUPS.forEach(function(g){
      var list = metrics.filter(function(m){ return m.grp === g[0]; });
      if (!list.length) return;
      html += '<section><h2>' + esc(g[1]) + '</h2><div class="grid">' + list.map(function(m){ return card(m, byHist[m.key]); }).join('') + '</div></section>';
    });

    // 3. heartbeats + outside services
    var hb = checks.filter(function(c){ return c.kind === 'heartbeat'; }), hl = checks.filter(function(c){ return c.kind === 'health'; });
    html += '<div class="two"><section><h2>هل الشغل اليومي حصل؟</h2><div class="tbl"><table><thead><tr><th>المهمة</th><th>المتوقع</th><th>حصل</th><th>الحالة</th></tr></thead><tbody>'
      + hb.map(function(c){ return '<tr><td>' + esc(LABELS[c.key] || c.label) + '<div class="sub">' + esc(note(c.note)) + '</div></td><td class="num">' + fmt(c.expected) + '</td><td class="num">' + fmt(c.actual) + '</td><td>' + pill(c.status) + '</td></tr>'; }).join('')
      + '</tbody></table></div></section>'
      + '<section><h2>الخدمات الخارجية</h2><div class="tbl"><table><thead><tr><th>الخدمة</th><th>آخر فحص</th><th>الحالة</th></tr></thead><tbody>'
      + hl.map(function(c){ return '<tr><td>' + esc(LABELS[c.key] || c.label) + '</td><td class="num">' + esc(note(c.note)) + '</td><td>' + pill(c.status) + '</td></tr>'; }).join('')
      + '</tbody></table></div></section></div>';
    // 4. client engagement (counts only, never message content)
    var ENG = { 'active': ['ok', 'نشط'], 'light': ['unknown', 'استخدام خفيف'], 'at risk': ['warn', 'ممكن يلغي'], 'inactive': ['bad', 'خامل'], 'no data yet': ['unknown', 'لسه ما في بيانات'] };
    var KIND = { text: 'نص', voice: 'صوت', photo: 'صورة', document: 'ملف', location: 'موقع', before_tracking: 'قبل التتبع' };
    var engRows = eng.error ? [] : (eng.data || []);
    html += '<section><h2>تفاعل العملاء</h2>' + (eng.error ? '<div class="sub">ما قدرنا نجيب أرقام التفاعل: ' + esc(eng.error.message) + '</div>'
      : !engRows.length ? '<div class="sub">ما في عملاء نشطين لسه</div>'
      : '<div class="tbl"><table><thead><tr><th>العميل</th><th>آخر 7 أيام</th><th>الأسبوع القبله</th><th>30 يوم</th><th>أيام نشاط</th><th>آخر نشاط</th><th>الحالة</th></tr></thead><tbody>'
        + engRows.map(function(r){
            var e = ENG[r.engagement] || ['unknown', r.engagement];
            var kinds = Object.keys(r.kinds_30d || {}).sort(function(x, y){ return r.kinds_30d[y] - r.kinds_30d[x]; })
              .map(function(k){ return (KIND[k] || k.replace(/^cmd:/, '')) + ' ' + r.kinds_30d[k]; }).join(' · ');
            return '<tr><td>' + esc(r.full_name) + '<div class="sub">' + esc(r.channel === 'whatsapp' ? 'واتساب' : r.channel === 'telegram' ? 'تيليجرام' : r.channel) + (kinds ? ' · ' + esc(kinds) : '') + '</div></td>'
              + '<td class="num">' + fmt(r.msgs_7d) + '</td><td class="num">' + fmt(r.msgs_prev_7d) + '</td><td class="num">' + fmt(r.msgs_30d) + '</td>'
              + '<td class="num">' + fmt(r.active_days_30d) + '</td><td class="num">' + esc(r.last_active ? day(r.last_active) : '—') + '</td>'
              + '<td><span class="pill ' + e[0] + '">' + esc(e[1]) + '</span></td></tr>';
          }).join('')
        + '</tbody></table></div><p class="sub">عدد الرسايل ونوعها بس، من غير أي محتوى. الأرقام بتتسجّل من 20 أكتوبر 2026.</p>')
      + '</section>';
    html += '<p class="foot">البيانات من فلو Ops Monitor في n8n. الأعطال بتتسجّل لحظة حصولها وبيجيك تنبيه في تيليجرام.</p>';
    $('board').innerHTML = html;
  }

  document.addEventListener('click', async function(ev){
    var b = ev.target.closest('[data-ev]');
    if (!b) return;
    b.disabled = true;
    var r = await sb.from('ops_events').update({ resolved_at: new Date().toISOString() }).eq('id', Number(b.getAttribute('data-ev')));
    if (r.error) { b.disabled = false; b.textContent = 'ما اتحفظ'; return; }
    var row = b.closest('.alert'); if (row) row.remove();
  });

  async function show(session){
    var signedIn = !!session;
    $('login').hidden = signedIn; $('logout').hidden = !signedIn; $('refresh').hidden = true;
    $('denied').hidden = true; $('board').hidden = true;
    if (!signedIn) { $('stamp').textContent = ''; return; }
    var a = await sb.from('ops_admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (!a.data) { $('denied').hidden = false; $('deniedEmail').textContent = session.user.email || ''; $('stamp').textContent = ''; return; }
    $('board').hidden = false; $('refresh').hidden = false;
    load();
  }

  $('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = $('loginMsg'); msg.className = 'msg'; msg.textContent = 'بيرسل…';
    $('sendLink').disabled = true;
    var r = await sb.auth.signInWithOtp({ email: $('email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
    $('sendLink').disabled = false;
    if (r.error) {
      msg.className = 'msg err';
      // Supabase's built-in mailer only sends a few login emails an hour
      msg.textContent = (r.error.status === 429 || /rate limit/i.test(r.error.message))
        ? 'طلبت روابط كتيرة في وقت قصير. استخدم آخر رابط وصلك، أو جرّب تاني بعد ساعة.'
        : 'ما قدرنا نرسل الرابط: ' + r.error.message;
      return;
    }
    msg.textContent = 'أرسلنا الرابط. افتح آخر إيميل وصلك واضغط الرابط من نفس المتصفح.';
  });
  $('logout').addEventListener('click', async function(){ await sb.auth.signOut(); show(null); });
  $('switchAccount').addEventListener('click', async function(){ await sb.auth.signOut(); show(null); });
  $('refresh').addEventListener('click', load);
  sb.auth.onAuthStateChange(function(_e, session){ show(session); });
  setInterval(function(){ if (!$('board').hidden && document.visibilityState === 'visible') load(); }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
