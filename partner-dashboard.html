<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Dashboard | Gear Radar</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15171C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171C; --ink-2:#1B1E25; --gold:#FF8A50; --gold-2:#FACC15; --gold-soft:rgba(255,138,80,.14);
  --paper:#F7F5F0; --white:#FFFFFF; --text:#0F172A; --muted:#5B6475; --line:#E6E2D8;
  --on-ink:#F5F5F4; --on-ink-muted:#A8A29E; --ok:#15803D; --warn:#B45309; --err:#B91C1C;
  --radius:18px; --shadow:0 20px 50px -24px rgba(21,23,28,.35);
  --font-head:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
html[lang="ar"]{ --font-head:'Cairo',system-ui,sans-serif; --font-body:'Cairo',system-ui,sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);color:var(--text);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1000px,100% - 32px);margin-inline:auto}
h1,h2{font-family:var(--font-head);line-height:1.25;letter-spacing:-.02em}
html[lang="ar"] h1,html[lang="ar"] h2{letter-spacing:0;line-height:1.4}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
header{background:var(--ink);color:var(--on-ink);padding-bottom:30px}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.back{color:var(--on-ink-muted);font-size:.93rem;text-decoration:none}
.lang{background:transparent;border:1px solid rgba(232,236,244,.25);color:var(--on-ink);padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:600;font-family:'Cairo','Inter',sans-serif}
.lang:hover{border-color:var(--gold);color:var(--gold)}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.9rem}
header h1{font-size:clamp(1.5rem,3.6vw,2.2rem);color:var(--white);margin:4px 0 16px}
.link{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--ink-2);border:1px solid rgba(232,236,244,.12);border-radius:16px;padding:12px}
.link code{flex:1;min-width:200px;font-size:.95rem;color:var(--white);direction:ltr;text-align:left;word-break:break-all}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;border:1px solid transparent;text-decoration:none;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{border-color:rgba(232,236,244,.25);color:var(--on-ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.codeline{color:var(--on-ink-muted);font-size:.9rem;margin-top:10px}
.codeline b{color:var(--white);direction:ltr;unicode-bidi:isolate}
main{padding:28px 0 50px;display:grid;gap:24px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card span{display:block;color:var(--muted);font-size:.85rem}
.card b{display:block;font-family:var(--font-head);font-size:1.6rem}
.card small{display:block;color:var(--muted);font-size:.8rem}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h2{font-size:1.1rem;padding:16px 20px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 20px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--muted);background:#FBFAF7;text-transform:uppercase;letter-spacing:.05em}
html[lang="ar"] th{text-transform:none;letter-spacing:0;font-size:.86rem}
tr:last-child td{border-bottom:0}
.empty{padding:20px;color:var(--muted)}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.p-pending{background:#FEF3C7;color:var(--warn)} .p-payable{background:#DCFCE7;color:var(--ok)}
.p-paid{background:#E0E7FF;color:#3730A3} .p-cancelled{background:#F1F5F9;color:#64748B} .p-proposed{background:#DCFCE7;color:var(--ok)}
.rules{color:var(--muted);font-size:.88rem}
.msg{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:760px){ .cards{grid-template-columns:1fr 1fr} th,td{padding:10px 12px} }
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="back" href="partners.html" data-i18n="back">← Partner programme</a>
    <button class="lang" id="langToggle" type="button">العربية</button>
  </div>
  <div class="container" id="head" hidden>
    <span class="eyebrow" data-i18n="eyebrow">Partner dashboard</span>
    <h1 id="hello"></h1>
    <div class="link">
      <code id="link"></code>
      <button class="btn btn-gold" type="button" id="copy" data-i18n="copy">Copy link</button>
      <a class="btn btn-ghost" id="shWa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn btn-ghost" id="shFb" target="_blank" rel="noopener">Facebook</a>
      <a class="btn btn-ghost" id="shX" target="_blank" rel="noopener">X</a>
    </div>
    <p class="codeline"><span data-i18n="code_is">Your code:</span> <b id="code"></b> · <span data-i18n="code_hint">people can also type it at checkout for 10% off.</span></p>
  </div>
</header>

<main class="container" id="main" hidden>
  <div class="cards">
    <div class="card"><span data-i18n="c_clicks">Visits (30 days)</span><b id="clicks"></b><small id="clicksAll"></small></div>
    <div class="card"><span data-i18n="c_customers">Customers</span><b id="customers"></b></div>
    <div class="card"><span data-i18n="c_pending">Pending</span><b id="pending"></b><small data-i18n="c_pending_h">confirmed after 30 days</small></div>
    <div class="card"><span data-i18n="c_payable">Ready / paid</span><b id="payable"></b><small id="paidLine"></small></div>
  </div>
  <div class="panel">
    <h2 data-i18n="t_comm">Commissions</h2>
    <div class="scroll" id="comm"></div>
  </div>
  <div class="panel">
    <h2 data-i18n="t_pay">Payouts</h2>
    <div class="scroll" id="pay"></div>
  </div>
  <p class="rules" id="rules"></p>
</main>
<div class="container msg" id="msg" data-i18n="loading">Loading…</div>

<script>
(function(){
  var ENDPOINT = 'https://kamtyler.app.n8n.cloud/webhook/gearradar-affiliate';
  var EN = {
    toggle:'العربية', back:'← Partner programme', eyebrow:'Partner dashboard', hi:'Hi {n}, here are your results',
    copy:'Copy link', copied:'Copied ✓', code_is:'Your code:', code_hint:'people can also type it at checkout for 10% off.',
    c_clicks:'Visits (30 days)', c_all:'{n} all time', c_customers:'Customers', c_pending:'Pending', c_pending_h:'confirmed after 30 days',
    c_payable:'Ready to pay', c_paid:'{n} paid so far', t_comm:'Commissions', t_pay:'Payouts',
    h_date:'Date', h_prod:'Product', h_type:'Type', h_amt:'Commission', h_status:'Status', h_ready:'Confirmed on',
    first:'First payment', renewal:'Monthly payment',
    s_pending:'Pending', s_payable:'Confirmed', s_paid:'Paid', s_cancelled:'Cancelled (refund)', s_proposed:'Being paid',
    none_c:'No commissions yet. Share your link to get started!', none_p:'No payouts yet.',
    rules:'You earn {a}% of the first payment and {b}% of Tala and monthly add-on payments for {m} months. Commissions are confirmed after {d} days and paid to {e} each month once you reach £{min}.',
    no_email:'your PayPal', loading:'Loading…', bad:'This dashboard link is not valid. Please use the link from your welcome email, or message us on WhatsApp.',
    waiting:'Your application is still being reviewed. We will email you as soon as it is approved.',
    share:'I use Gear Radar for my business. Get 10% off with my link: ',
    p_butler:'Tala', p_website:'Website', p_smart_qr:'Smart QR menu', p_web_qr:'Website + QR bundle'
  };
  var AR = {
    toggle:'English', back:'→ برنامج الشركاء', eyebrow:'لوحة الشريك', hi:'أهلاً {n}، هذي نتائجك',
    copy:'انسخ الرابط', copied:'تم النسخ ✓', code_is:'كودك:', code_hint:'يقدر العميل يكتبه عند الدفع ويحصل على خصم 10%.',
    c_clicks:'الزيارات (30 يوم)', c_all:'{n} من البداية', c_customers:'العملاء', c_pending:'معلّقة', c_pending_h:'تتأكد بعد 30 يوم',
    c_payable:'جاهزة للدفع', c_paid:'{n} مدفوعة لحد الآن', t_comm:'العمولات', t_pay:'الدفعات',
    h_date:'التاريخ', h_prod:'المنتج', h_type:'النوع', h_amt:'العمولة', h_status:'الحالة', h_ready:'تتأكد في',
    first:'أول دفعة', renewal:'دفعة شهرية',
    s_pending:'معلّقة', s_payable:'مؤكدة', s_paid:'مدفوعة', s_cancelled:'ملغاة (استرجاع)', s_proposed:'قيد الدفع',
    none_c:'ما فيه عمولات للحين. شارك رابطك وابدأ!', none_p:'ما فيه دفعات للحين.',
    rules:'تربح {a}% من أول دفعة و{b}% من دفعات تالا والإضافات الشهرية لمدة {m} شهر. العمولات تتأكد بعد {d} يوم وتُدفع على {e} كل شهر لما يوصل رصيدك £{min}.',
    no_email:'حسابك في PayPal', loading:'جاري التحميل…', bad:'رابط اللوحة هذا غير صالح. استخدم الرابط من إيميل الترحيب أو راسلنا على واتساب.',
    waiting:'طلبك ما زال تحت المراجعة، وراح نراسلك أول ما تتم الموافقة.',
    share:'أستخدم Gear Radar لشغلي. خذ خصم 10% من رابطي: ',
    p_butler:'تالا', p_website:'موقع', p_smart_qr:'قائمة QR الذكية', p_web_qr:'باقة موقع + QR'
  };
  var lang = 'en', data = null, state = 'loading';
  var $ = function(id){ return document.getElementById(id); };
  function s(){ return lang === 'ar' ? AR : EN; }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fill(t, o){ return t.replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ''; }); }
  function money(n, cur){
    var v = Number(n || 0), c = String(cur || 'GBP').toUpperCase();
    var sym = { GBP:'£', USD:'$', EUR:'€' }[c];
    return sym ? sym + v.toFixed(2) : v.toFixed(2) + ' ' + c;
  }
  function pill(st){ return '<span class="pill p-' + esc(st) + '">' + esc(s()['s_' + st] || st) + '</span>'; }

  function render(){
    var t = s();
    document.querySelectorAll('[data-i18n]').forEach(function(el){ var k = el.getAttribute('data-i18n'); if (t[k] != null) el.textContent = t[k]; });
    $('langToggle').textContent = t.toggle;
    if (state !== 'ok') { $('msg').textContent = t[state] || t.loading; return; }
    var d = data, cur = d.currency || 'GBP', tot = d.totals || {};
    $('hello').textContent = fill(t.hi, { n: String(d.name || '').split(' ')[0] });
    $('link').textContent = d.link; $('code').textContent = d.code;
    var msg = encodeURIComponent(t.share + d.link);
    $('shWa').href = 'https://wa.me/?text=' + msg;
    $('shFb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(d.link);
    $('shX').href = 'https://twitter.com/intent/tweet?text=' + msg;
    $('clicks').textContent = d.clicks_30d; $('clicksAll').textContent = fill(t.c_all, { n: d.clicks_total });
    $('customers').textContent = d.customers;
    $('pending').textContent = money(tot.pending, cur);
    $('payable').textContent = money(tot.payable, cur);
    $('paidLine').textContent = fill(t.c_paid, { n: money(tot.paid, cur) });
    var rows = (d.recent || []).map(function(r){
      return '<tr><td>' + esc(r.date) + '</td><td>' + esc(t['p_' + r.product] || r.product) + '</td><td>' + esc(r.kind === 'renewal' ? t.renewal : t.first) +
        '</td><td><b>' + money(r.amount, r.currency) + '</b></td><td>' + pill(r.status) + '</td><td>' + esc(r.status === 'pending' ? r.eligible : '') + '</td></tr>';
    }).join('');
    $('comm').innerHTML = rows ? '<table><thead><tr><th>' + t.h_date + '</th><th>' + t.h_prod + '</th><th>' + t.h_type + '</th><th>' + t.h_amt + '</th><th>' + t.h_status + '</th><th>' + t.h_ready + '</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<p class="empty">' + t.none_c + '</p>';
    var pays = (d.payouts || []).map(function(p){
      return '<tr><td>' + esc(p.date) + '</td><td><b>' + money(p.amount, p.currency) + '</b></td><td>' + pill(p.status) + '</td></tr>';
    }).join('');
    $('pay').innerHTML = pays ? '<table><thead><tr><th>' + t.h_date + '</th><th>' + t.h_amt + '</th><th>' + t.h_status + '</th></tr></thead><tbody>' + pays + '</tbody></table>' : '<p class="empty">' + t.none_p + '</p>';
    $('rules').textContent = fill(t.rules, { a: d.commission_pct, b: d.recurring_pct, m: d.recurring_months, d: d.hold_days, e: d.payout_email || t.no_email, min: d.min_payout });
  }
  function applyLang(l){
    lang = l; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    try { localStorage.setItem('gr_lang', l); } catch(e) {}
    render();
  }
  $('langToggle').addEventListener('click', function(){ applyLang(lang === 'ar' ? 'en' : 'ar'); });
  $('copy').addEventListener('click', function(){
    var done = function(){ $('copy').textContent = s().copied; setTimeout(function(){ $('copy').textContent = s().copy; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(data.link).then(done, function(){}); else done();
  });

  var params = new URLSearchParams(location.search), initial = params.get('lang');
  if (initial !== 'ar' && initial !== 'en') { try { initial = localStorage.getItem('gr_lang') || 'en'; } catch(e) { initial = 'en'; } }
  applyLang(initial === 'ar' ? 'ar' : 'en');

  var token = params.get('t') || '';
  if (!/^[0-9a-f-]{36}$/i.test(token)) { state = 'bad'; render(); return; }
  fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ action:'dashboard', token: token }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok) { state = 'bad'; }
      else if (j.status !== 'active' || !j.code) { state = 'waiting'; }
      else { state = 'ok'; data = j; $('head').hidden = false; $('main').hidden = false; $('msg').hidden = true; }
      render();
    })
    .catch(function(){ state = 'bad'; render(); });
})();
</script>
</body>
</html>
