name: Build Tala Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - name: Publish APK to the site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/release/app-release.apk downloads/tala.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add downloads/tala.apk
          git commit -m "Update Tala Android test APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: tala-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
